[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-document-tasks"
version = "0.1.0"
description = "Local Uzbek PDF analysis using evidence-grounded Tev1 decisions"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "pdfplumber>=0.11,<1",
    "pypdf>=5,<7",
    "Pillow>=11,<13",
    "python-multipart>=0.0.20,<1",
    "psutil>=7,<8",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
doc-tasks = "doc_tasks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_tasks"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
